services:
  engine:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - engine-data:/data
    environment:
      # 'hash' starts instantly with no model download. Switch to 'local' for
      # real semantic retrieval (first start then downloads ~80 MB).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # memory (default) or pgvector. With pgvector, point DATABASE_URL at db.
      STORE: ${STORE:-memory}
      DATABASE_URL: ${DATABASE_URL:-postgresql://engine:engine@db:5432/engine}
      # Empty disables the query cache; redis://redis:6379/0 enables it.
      REDIS_URL: ${REDIS_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres with pgvector, for STORE=pgvector. Not required by the default
  # in-memory configuration, which is what the evaluation uses.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: engine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Query cache, for REDIS_URL. Optional: without it every query runs uncached.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  engine-data:
  pgdata:
